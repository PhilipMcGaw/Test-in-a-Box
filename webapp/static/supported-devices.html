<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test in a Box — Supported Devices</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<style>
  html, body { height: 100%; margin: 0; font-family: Segoe UI, Arial, sans-serif; color: #222; }
  #top-bar { background: #23272f; color: white; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
  #top-bar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #top-bar a.nav-link { color: #9fb3c8; text-decoration: none; font-size: 13px; }
  #top-bar a.nav-link:hover { text-decoration: underline; }
  #content { max-width: 820px; margin: 0 auto; padding: 32px 24px 60px 24px; }
  #content > p.intro { line-height: 1.5; color: #444; }
  h2.category-heading { font-size: 13px; text-transform: uppercase; color: #888; margin-top: 30px;
                         border-bottom: 1px solid #ddd; padding-bottom: 6px; }
  .device-entry { border: 1px solid #e0e0e0; border-radius: 6px; padding: 14px 18px; margin-top: 12px; }
  .device-entry h3 { margin: 0 0 6px 0; font-size: 15px; }
  .device-entry .desc { color: #333; font-size: 13px; line-height: 1.5; margin: 0 0 8px 0; }
  .status-badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 10px;
                   font-weight: 600; }
  .status-tested { background: #d4f5df; color: #1b7a3d; }
  .status-untested { background: #fdf0d5; color: #9a6a12; }
  .status-demo { background: #e6ecf1; color: #556; }
  .fields-list { font-size: 12px; color: #666; margin-top: 6px; }
  .fields-list code { background: #f2f2f2; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
  <div id="top-bar">
    <img src="/static/icons/icon-32.png" alt="" width="26" height="26">
    <h1>Test in a Box</h1>
    <a class="nav-link" href="/">◀ Test Builder</a>
    <a class="nav-link" href="/devices">Configure Devices</a>
    <a class="nav-link" href="/about">About</a>
  </div>

  <div id="content">
    <p class="intro">
      Every device type this app currently knows how to talk to. This list is
      generated directly from the driver catalog, so it updates automatically
      as new device types are added — no separate documentation to keep in sync.
    </p>
    <div id="device-list">Loading…</div>
  </div>

  <script>
    const categoryLabels = { psu: 'Power Supplies', relay: 'Relays', daq: 'Data Acquisition', generic: 'Generic / SCPI' };

    function statusClass(status) {
      if (!status) return 'status-untested';
      if (status.includes('demo')) return 'status-demo';
      if (status.includes('not yet confirmed')) return 'status-untested';
      if (status.includes('tested')) return 'status-tested';
      return 'status-untested';
    }

    async function load() {
      const res = await fetch('/api/device_types');
      const catalog = await res.json();

      const byCategory = {};
      for (const [typeName, info] of Object.entries(catalog)) {
        byCategory[info.category] = byCategory[info.category] || [];
        byCategory[info.category].push([typeName, info]);
      }

      let html = '';
      for (const [cat, items] of Object.entries(byCategory)) {
        html += `<h2 class="category-heading">${categoryLabels[cat] || cat}</h2>`;
        for (const [typeName, info] of items) {
          const fieldsList = (info.fields || []).map(f => `<code>${f.label}</code>`).join(', ');
          html += `
            <div class="device-entry">
              <h3>${info.label} <span class="status-badge ${statusClass(info.status)}">${info.status || 'status unknown'}</span></h3>
              <p class="desc">${info.description || ''}</p>
              ${fieldsList ? `<div class="fields-list">Configurable: ${fieldsList}</div>` : ''}
            </div>`;
        }
      }
      document.getElementById('device-list').innerHTML = html;
    }

    load();
  </script>
</body>
</html>
