<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test in a Box</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<style>
  html, body { height: 100%; margin: 0; font-family: Segoe UI, Arial, sans-serif; }
  #top-bar { background: #23272f; color: white; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
  #top-bar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #run-btn { background: #2ecc71; color: white; border: none; padding: 8px 20px; font-size: 14px;
             border-radius: 4px; cursor: pointer; }
  #run-btn:disabled { background: #7f8c8d; cursor: default; }
  #pause-btn, #step-btn, #stop-btn { color: white; border: none; padding: 8px 16px; font-size: 14px;
             border-radius: 4px; cursor: pointer; }
  #pause-btn { background: #f39c12; }
  #step-btn { background: #3498db; }
  #stop-btn { background: #e74c3c; }
  #pause-btn:disabled, #step-btn:disabled, #stop-btn:disabled { background: #7f8c8d; cursor: default; }
  #refresh-devices-btn { background: #34495e; color: white; border: none; padding: 6px 14px;
                         border-radius: 4px; cursor: pointer; font-size: 13px; }
  #sequence-bar { background: #f4f4f4; border-bottom: 1px solid #ccc; padding: 8px 16px;
                  display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #sequence-bar label { color: #555; }
  #sequence-bar select, #sequence-bar input { padding: 4px 6px; font-size: 13px; }
  #sequence-bar input { width: 160px; }
  #sequence-bar button { background: #34495e; color: white; border: none; padding: 5px 12px;
                          border-radius: 4px; cursor: pointer; font-size: 13px; }
  #main { display: flex; height: calc(100% - 92px); }
  #blocklyDiv { flex: 3; height: 100%; }
  #side { flex: 2; display: flex; flex-direction: column; border-left: 1px solid #ccc; min-width: 320px; }
  #devices-panel { flex: 0 0 22%; min-height: 80px; padding: 10px; border-bottom: 1px solid #ccc; overflow-y: auto; }
  #devices-panel h2 { font-size: 13px; margin: 0 0 6px 0; color: #555; }
  #device-list { margin: 0; padding-left: 18px; font-size: 13px; }
  #console-panel { flex: 1 1 38%; min-height: 100px; display: flex; flex-direction: column; }
  #console-panel h2 { font-size: 13px; margin: 8px 10px 4px 10px; color: #555; }
  #console { flex: 1; min-height: 0; background: #111; color: #0f0; font-family: Consolas, monospace; font-size: 12px;
             margin: 0 10px 10px 10px; padding: 8px; overflow-y: auto; white-space: pre-wrap; border-radius: 4px; }
  #code-panel { flex: 0 0 28%; min-height: 100px; border-top: 1px solid #ccc; display: flex; flex-direction: column; }
  #code-panel h2 { font-size: 13px; margin: 8px 10px 4px 10px; color: #555; }
  #generated-code { flex: 1; min-height: 0; margin: 0 10px 10px 10px; padding: 8px; background: #f4f4f4; font-family: Consolas, monospace;
                     font-size: 12px; overflow-y: auto; white-space: pre-wrap; border-radius: 4px; }
</style>
</head>
<body>
  <div id="top-bar">
    <img id="app-logo" src="/static/icons/icon-32.png" alt="" width="26" height="26">
    <h1>Test in a Box</h1>
    <button id="run-btn">▶ Run</button>
    <button id="pause-btn" disabled>⏸ Pause</button>
    <button id="step-btn" disabled>⏭ Step</button>
    <button id="stop-btn" disabled>⏹ Stop</button>
    <button id="refresh-devices-btn">Refresh devices</button>
    <a href="/devices" style="color:#9fb3c8; text-decoration:none; font-size:13px; margin-left: 8px;">⚙ Configure Devices</a>
    <a href="/supported-devices" style="color:#9fb3c8; text-decoration:none; font-size:13px;">🔌 Supported Devices</a>
    <a href="/engineering-tools/protocol-explorer" style="color:#9fb3c8; text-decoration:none; font-size:13px;">🛠 Protocol Explorer</a>
    <a href="/about" style="color:#9fb3c8; text-decoration:none; font-size:13px;">ℹ️ About</a>
  </div>
  <div id="sequence-bar">
    <label for="sequence-select">Sequence:</label>
    <select id="sequence-select"></select>
    <button id="load-sequence-btn">Load</button>
    <span style="width: 12px;"></span>
    <input id="sequence-name" type="text" placeholder="name to save as...">
    <button id="save-sequence-btn">Save As</button>
  </div>
  <div id="main">
    <div id="blocklyDiv"></div>
    <div id="side">
      <div id="devices-panel">
        <h2>Connected devices</h2>
        <ul id="device-list"></ul>
      </div>
      <div id="console-panel">
        <h2>Console</h2>
        <div id="console"></div>
      </div>
      <div id="code-panel">
        <h2>Generated Python (for reference)</h2>
        <pre id="generated-code"></pre>
      </div>
    </div>
  </div>

  <script src="/static/blockly/blockly_compressed.js"></script>
  <script src="/static/blockly/blocks_compressed.js"></script>
  <script src="/static/blockly/msg/en.js"></script>
  <script src="/static/blockly/python_compressed.js"></script>
  <script src="/static/custom_blocks.js"></script>
  <script src="/static/generators.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
